<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bish's RV TEC Placement Assessment</title><style>
:root{--ink:#15212b;--muted:#637381;--line:#d7e0e6;--bg:#eef3f6;--card:#fff;--blue:#155d8b;--blue2:#0d3f61;--ok:#246b49;--bad:#8b2f2f;--amber:#8a5a00}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)} header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5} .top{max-width:1000px;margin:auto;padding:13px 18px;display:flex;gap:14px;align-items:center} .brand{font-weight:900;font-size:18px}.sub{font-size:13px;color:var(--muted)}.grow{flex:1}.bar{height:5px;background:#dfe7ec}.fill{height:5px;background:var(--blue);width:0;transition:.2s}main{max-width:1000px;margin:24px auto;padding:0 16px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 2px 8px #0000000a}h1{font-size:28px;margin:8px 0 12px}h2{font-size:22px;margin:8px 0 12px}.tag{display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--blue);background:#edf5fa;padding:5px 9px;border-radius:20px}.prompt{font-size:19px;font-weight:700;margin:18px 0}.note{background:#f6f9fb;border:1px solid var(--line);padding:13px 15px;border-radius:10px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-weight:700}input[type=text],textarea{width:100%;border:1px solid #b8c6cf;border-radius:9px;padding:11px;font:inherit;margin-top:6px}textarea{min-height:115px;resize:vertical}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px}.check{display:flex;gap:8px;align-items:flex-start;font-weight:500;padding:7px 0}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}button{border:0;border-radius:9px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#e5edf2;color:var(--ink)}.coursebox{border-top:1px solid var(--line);padding:16px 0}.code,.tiny{font-size:13px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.metric{border:1px solid var(--line);background:#f8fafb;border-radius:10px;padding:14px}.metric b{display:block;font-size:26px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}th{position:sticky;top:76px;background:#f4f7f9}.sign,.pass{color:var(--ok);font-weight:900}.nosign,.fail{color:var(--bad);font-weight:900}@media(max-width:700px){.grid,.checks,.metrics{grid-template-columns:1fr}.card{padding:18px}h1{font-size:24px}}</style></head><body><header><div class="top"><div class="grow"><div class="brand">Bish's RV TEC Placement Assessment</div><div class="sub" id="meta">New-hire competency placement</div></div><button class="secondary" id="restartTop" onclick="restart()" style="display:none">New technician</button></div><div class="bar"><div class="fill" id="fill"></div></div></header><main><section class="card" id="app"></section></main><script src="courses1.js"></script><script src="courses2.js"></script><script src="courses3.js"></script><script src="courses4.js"></script><script src="courses5.js"></script><script src="courses6.js"></script><script src="config.js"></script><script src="app1.js"></script><script src="app2.js"></script><script src="app3.js"></script><script src="app4.js"></script></body></html>

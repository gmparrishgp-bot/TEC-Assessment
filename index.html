<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEC Adaptive Competency Pilot</title>
<style>
:root{--ink:#14202b;--muted:#637381;--line:#d8e0e6;--bg:#eef3f6;--card:#fff;--blue:#1d5c88;--blue2:#123f61;--ok:#2d6a4f;--warn:#8a5a00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.top{max-width:960px;margin:auto;padding:12px 18px;display:flex;gap:14px;align-items:center}.logo{width:88px;max-height:45px;object-fit:contain}.grow{flex:1}.title{font-weight:800}.meta{font-size:13px;color:var(--muted)}.bar{height:5px;background:#dfe7ec}.fill{height:5px;background:var(--blue);width:0}.wrap{max-width:960px;margin:24px auto;padding:0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 2px 8px #0000000a}.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--blue);background:#edf5fa;padding:5px 8px;border-radius:20px}.complaint{margin:16px 0;padding:14px 16px;border-left:4px solid var(--blue);background:#f7fafc}.q{font-size:20px;font-weight:750;margin:18px 0}.opt{border:1px solid var(--line);padding:13px 14px;border-radius:10px;margin:9px 0;cursor:pointer;background:#fff}.opt:hover{border-color:#91a9b8;background:#f8fbfd}.opt.sel{border-color:var(--blue);background:#eef6fb}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:11px 16px;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#e7edf1;color:var(--ink)}input,textarea{width:100%;border:1px solid #bfcbd3;border-radius:9px;padding:11px;font:inherit}textarea{min-height:130px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.claim{display:flex;gap:9px;align-items:flex-start;padding:9px 0}.note{background:#f5f8fa;border:1px solid var(--line);padding:13px;border-radius:9px;margin:12px 0}.tiny{font-size:13px;color:var(--muted)}.metricgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{padding:14px;background:#f7fafc;border:1px solid var(--line);border-radius:10px}.metric .v{font-size:24px;font-weight:850}.metric .l{font-size:12px;color:var(--muted)}.diagram{overflow:auto;margin:12px 0}.diagram svg{max-width:100%;height:auto}.diagramcap{font-size:12px;color:var(--muted)}
@media(max-width:650px){.grid,.metricgrid{grid-template-columns:1fr}.card{padding:18px}.q{font-size:18px}.logo{width:70px}}
</style></head><body><header><div class="top"><div class="grow"><div class="title">TEC Competency Assessment — Pilot</div><div class="meta" id="meta">Adaptive diagnostic assessment</div></div></div><div class="bar"><div class="fill" id="fill"></div></div></header><main class="wrap"><section class="card" id="app"></section></main>
<script>
const UKG=[
{id:'172101',title:'GFCI',group:'Electrical'},{id:'175596',title:'GFCI',group:'Electrical'},
{id:'E-VOLT',title:'Testing Voltage',group:'Electrical'},{id:'E-RES',title:'Testing Resistance',group:'Electrical'},{id:'E-CUR',title:'Testing Current',group:'Electrical'},{id:'E-SCHEM',title:'Electrical Schematics',group:'Electrical'},{id:'E-COMP',title:'Electrical Component Identification',group:'Electrical'},{id:'E-DIAG',title:'12V Electrical Diagnosis',group:'Electrical'},{id:'E-AC',title:'120V Electrical Diagnosis',group:'Electrical'},{id:'E-ATS',title:'Transfer Switch',group:'Electrical'},
{id:'LP-PRESS',title:'LP Pressure Testing',group:'LP / Appliances'},{id:'LP-LEAK',title:'LP Leak Testing',group:'LP / Appliances'},{id:'LP-COMP',title:'LP Components',group:'LP / Appliances'},
{id:'WH-DIAG',title:'Water Heater Diagnosis',group:'LP / Appliances'},{id:'WH-COMP',title:'Water Heater Components',group:'LP / Appliances'},
{id:'FUR-DIAG',title:'Furnace Diagnosis',group:'LP / Appliances'},{id:'REF-DIAG',title:'Absorption Refrigerator Diagnosis',group:'LP / Appliances'},
{id:'PLB-DIAG',title:'Plumbing Diagnosis',group:'Plumbing'},{id:'PLB-PRESS',title:'Pressure Sources',group:'Plumbing'},{id:'PLB-VALVE',title:'Valves / Fixtures',group:'Plumbing'},
{id:'SLD-DIAG',title:'Slide Diagnosis',group:'Slides / Leveling / Hydraulics'},{id:'HYD-DIAG',title:'Hydraulic Diagnosis',group:'Slides / Leveling / Hydraulics'},
{id:'GEN-DIAG',title:'Generator Diagnosis',group:'A/V / Generator'},{id:'INV-DIAG',title:'Inverter Diagnosis',group:'Electrical'},{id:'SOL-DIAG',title:'Solar Diagnosis',group:'Electrical'},
{id:'BODY-SEAL',title:'Sealants / Water Intrusion',group:'Exterior / Body'},{id:'PDI',title:'PDI / Final Verification',group:'Service Process / General'}
];
const SCENARIOS=[
{id:'WH1',name:'Water Heater — No Ignition',domain:'LP / Appliances',complaint:'Customer states the water heater will not ignite on LP. The unit has propane and the stove will light.',stages:[
{id:'WH1-1',type:'short',q:'You are starting this diagnosis. Walk me through the first checks you would make before condemning a component.',targets:['WH-DIAG','E-VOLT','LP-PRESS'],rubric:['12v','voltage','power','gas','propane','pressure','sequence'],clarify:'Focus only on what you would physically verify first at the water heater and why.'},
{id:'WH1-2',type:'mc',q:'You verify 12.6 VDC at the water heater input. During an ignition attempt, the board sends 12 VDC to the gas valve but there is no flame. What is the best next test?',opts:['Check LP pressure at the water heater gas valve test port while the appliance is calling for gas','Replace the gas valve because it has power','Adjust the regulator until the stove flame gets larger','Replace the control board'],ans:0,targets:['WH-DIAG','LP-PRESS','WH-COMP']},
{id:'WH1-3',type:'short',q:'Running pressure at the water heater drops well below normal when it attempts to fire. What does that tell you, and what would you check before replacing water-heater parts?',targets:['WH-DIAG','LP-PRESS','LP-COMP'],rubric:['supply','regulator','restriction','pressure','demand','other appliance'],clarify:'Explain whether this reading points more toward the appliance or the LP supply system.'},
{id:'WH1-4',type:'mc',q:'LP pressure remains correct under demand. The valve receives proper voltage but does not open. Which conclusion is best supported?',opts:['The gas valve itself is now a strong suspect, but verify the valve/component per manufacturer procedure before replacement','The regulator must still be bad','The control board is definitely bad','The igniter gap is the only remaining possible cause'],ans:0,targets:['WH-DIAG','WH-COMP','E-VOLT']},
{id:'WH1-5',type:'short',q:'After the repair, what do you verify before calling the job complete?',targets:['WH-DIAG','PDI','LP-LEAK'],rubric:['operation','leak','pressure','cycle','both modes','verify'],clarify:'Think about operation, safety, and proving the repair rather than only whether it lights once.'}
]},
{id:'AC1',name:'120V / GFCI — Dead Receptacles',domain:'Electrical',complaint:'Customer reports the bathroom and exterior receptacles are dead on shore power. Other 120V loads work normally.',stages:[
{id:'AC1-1',type:'short',q:'What would you check first, and what measurements would help you separate a source problem from a branch-circuit/GFCI problem?',targets:['E-AC','E-VOLT','172101','175596'],rubric:['voltage','line','load','gfci','breaker','shore'],clarify:'Describe the voltage checks you would make at the breaker/GFCI rather than naming parts to replace.'},
{id:'AC1-2',type:'mc',q:'You have 121 VAC on the LINE terminals of the GFCI, 0 VAC on LOAD after reset, and the device will not reset with the load conductors disconnected. What is the strongest conclusion?',opts:['The GFCI device itself has failed','The campground pedestal is bad','The converter reverse-polarity fuses are open','The generator must be running too slowly'],ans:0,targets:['172101','175596','E-AC','E-VOLT']},
{id:'AC1-3',type:'short',q:'If the GFCI resets with the downstream LOAD conductors disconnected but trips as soon as the LOAD is reconnected, how would you continue?',targets:['172101','175596','E-AC','E-SCHEM'],rubric:['downstream','isolate','branch','receptacle','fault','divide'],clarify:'Explain how you would isolate the downstream fault instead of replacing the GFCI.'}
]},
{id:'DC1',name:'12V Slide — Slow / Stops Under Load',domain:'Electrical',complaint:'A through-frame electric slide starts moving, slows badly, then stops. Battery voltage at rest is 12.5 VDC.',stages:[
{id:'DC1-1',type:'mc',q:'Loaded voltage at the controller input falls to 9.2 VDC while the slide is moving. What should you determine next?',opts:['Where the voltage is being lost under load, using voltage-drop testing on both positive and ground paths','Replace the motor immediately','Install a larger fuse','Test the 120V branch circuit'],ans:0,targets:['E-DIAG','E-VOLT','SLD-DIAG']},
{id:'DC1-2',type:'short',q:'Positive-side drop is 0.4 V and ground-side drop is 2.7 V while the motor is loaded. Interpret those numbers and tell me where you would work next.',targets:['E-DIAG','E-VOLT','SLD-DIAG'],rubric:['ground','high resistance','connection','cable','voltage drop'],clarify:'Which side of the circuit contains the excessive loss, and what kinds of faults cause it?'},
{id:'DC1-3',type:'mc',q:'After repairing the high-resistance ground, voltage at the motor stays near source voltage but current is unusually high and the slide still strains. What direction should the diagnosis take?',opts:['Mechanical binding/load or a failing motor/drive system, because supply voltage is now staying up','Increase circuit-breaker size','Replace the converter because current is high','Add another battery without checking the mechanism'],ans:0,targets:['E-CUR','SLD-DIAG','E-DIAG']}
]},
{id:'FUR1',name:'Furnace — Blower Runs, No Heat',domain:'LP / Appliances',complaint:'Furnace blower starts and runs, but the burner never lights.',stages:[
{id:'FUR1-1',type:'short',q:'Walk through the furnace sequence far enough to tell me what you would verify before blaming the gas valve or board.',targets:['FUR-DIAG','E-VOLT','LP-PRESS'],rubric:['blower','sail','limit','board','ignition','gas','pressure','voltage'],clarify:'Use the operating sequence to explain what must happen before the gas valve should be energized.'},
{id:'FUR1-2',type:'mc',q:'The sail switch closes, limit circuit is closed, the board produces proper ignition output, the gas valve receives proper voltage, and LP inlet pressure is normal. There is still no gas flow. Best next direction?',opts:['Test/verify the gas valve itself and the gas path at the furnace','Increase LP regulator pressure above specification','Replace the blower motor because it ran first','Replace the thermostat because the furnace responded to the call'],ans:0,targets:['FUR-DIAG','LP-PRESS','E-VOLT']}
]},
{id:'PLB1',name:'Plumbing — Low Flow / Pressure',domain:'Plumbing',complaint:'Customer reports weak water flow at multiple fixtures on city water, but the freshwater pump performs normally from the tank.',stages:[
{id:'PLB1-1',type:'short',q:'How would you isolate whether the restriction is in the campground source, inlet/regulator, coach plumbing, or individual fixtures?',targets:['PLB-DIAG','PLB-PRESS','PLB-VALVE'],rubric:['pressure','source','regulator','inlet','multiple fixtures','restriction'],clarify:'Use pressure/flow comparisons at different points to isolate the restriction.'},
{id:'PLB1-2',type:'mc',q:'Pressure is good at the hose before the coach but low immediately after the coach inlet/regulator, with all fixtures affected. What is the best-supported direction?',opts:['Inspect/test the inlet/regulator/check-valve area for restriction or failure','Replace every faucet aerator','Replace the freshwater pump','Increase water-heater temperature'],ans:0,targets:['PLB-DIAG','PLB-PRESS','PLB-VALVE']}
]},
{id:'GEN1',name:'Generator — Starts, No Coach Power',domain:'A/V / Generator',complaint:'Generator starts and runs normally, but the coach has no 120V power from the generator. Shore power works normally.',stages:[
{id:'GEN1-1',type:'short',q:'How would you separate a generator-output problem from a transfer/supply problem?',targets:['GEN-DIAG','E-AC','E-ATS','E-VOLT'],rubric:['output','voltage','breaker','transfer','input','output'],clarify:'Describe where you would measure voltage from the generator through the transfer path.'},
{id:'GEN1-2',type:'mc',q:'You measure correct generator voltage entering the automatic transfer switch, but no voltage leaves the generator side of the switch after the transfer delay. Shore input and shore output work. Best direction?',opts:['Diagnose the transfer switch/control for failure to transfer the generator source','Increase generator speed','Replace the converter','Replace the GFCI receptacle'],ans:0,targets:['GEN-DIAG','E-ATS','E-VOLT','E-AC']}
]},
{id:'INV1',name:'Inverter — Shuts Down Under Microwave Load',domain:'Electrical',complaint:'While boondocking, the inverter runs light loads normally but shuts down when the microwave starts.',stages:[
{id:'INV1-1',type:'short',q:'What measurements would you make during the microwave start to separate an inverter problem from a DC supply/battery/cabling problem?',targets:['INV-DIAG','E-VOLT','E-CUR','E-DIAG'],rubric:['battery','inverter input','voltage drop','current','load','dc'],clarify:'Compare voltage at the battery and at the inverter while the microwave starts.'},
{id:'INV1-2',type:'mc',q:'Battery terminals stay at 12.2 V during the start attempt, but inverter DC input falls to 9.8 V. What is the strongest direction?',opts:['Excessive DC-side voltage drop in cabling/connections/protection between battery and inverter','The microwave is definitely defective','The shore-power GFCI is tripped','Solar-controller output frequency is wrong'],ans:0,targets:['INV-DIAG','E-VOLT','E-DIAG']}
]},
{id:'SOL1',name:'Solar — Expansion / Controller Limit',domain:'Electrical',complaint:'A customer wants to add panels to an existing roof array and keep the current controller.',stages:[
{id:'SOL1-1',type:'short',q:'What information do you need before deciding whether the added panels can be connected to the existing controller?',targets:['SOL-DIAG','E-CUR','E-VOLT'],rubric:['voc','isc','controller','input','temperature','series','parallel'],clarify:'Think controller voltage/current limits and how the array configuration changes them.'},
{id:'SOL1-2',type:'mc',q:'The proposed series string would exceed the controller maximum PV input voltage after cold-temperature Voc correction. What should happen?',opts:['Change the array/controller design so corrected maximum Voc stays within the controller specification','Use a larger battery fuse only','Ignore Voc because only amperage matters','Increase inverter output frequency'],ans:0,targets:['SOL-DIAG','E-VOLT']}
]},
{id:'BODY1',name:'Exterior — Water Intrusion',domain:'Exterior / Body',complaint:'Customer reports staining below a window after heavy rain. Exterior sealant has several questionable areas.',stages:[
{id:'BODY1-1',type:'short',q:'How would you prove the leak source before resealing or replacing parts?',targets:['BODY-SEAL','PDI'],rubric:['water test','isolate','inspect','source','sealant','verify'],clarify:'Explain how you would isolate and reproduce the leak rather than sealing everything you see.'},
{id:'BODY1-2',type:'mc',q:'You reproduce the leak at one upper window-corner interface while surrounding seams stay dry. What should determine the repair material and prep?',opts:['The substrate, existing material, failure mode, and the sealant/manufacturer instructions for that joint','Whatever sealant is already open in the shop','Roof membrane type only','The color of the old sealant'],ans:0,targets:['BODY-SEAL','PDI']}
]}
];
const ALL=[...UKG];let S={name:'',location:'',claims:new Set(),skill:{},scenarioQueue:[],scenarioIndex:0,stageIndex:0,answers:[],clarified:{},done:false};
function initSkills(){ALL.forEach(x=>S.skill[x.id]={id:x.id,title:x.title,group:x.group,pos:0,neg:0,contexts:new Set(),safety:false,resolved:null,evidence:[]});}
function addEvidence(ids,dir,strength,ctx,reason){ids.forEach(id=>{let s=S.skill[id];if(!s)return;if(dir==='pos')s.pos+=strength;else if(dir==='neg')s.neg+=strength;if(ctx)s.contexts.add(ctx);s.evidence.push({dir,strength,ctx,reason});resolve(s);});}
function resolve(s){if(s.safety){s.resolved='NO';return}if(s.pos>=3.2&&s.contexts.size>=2)s.resolved='YES';else if(s.pos>=2.5&&s.contexts.size>=1&&['WH-DIAG','FUR-DIAG','REF-DIAG','SLD-DIAG','GEN-DIAG','INV-DIAG','SOL-DIAG','PLB-DIAG'].includes(s.id))s.resolved='YES';else if(s.neg>=3)s.resolved='NO';}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function app(h){document.getElementById('app').innerHTML=h}function meta(t){document.getElementById('meta').textContent=t}function prog(){let total=S.scenarioQueue.reduce((n,x)=>n+x.stages.length,0)||1,done=S.answers.length;document.getElementById('fill').style.width=Math.min(100,done/total*100)+'%'}
function profile(){app(`<span class="tag">TEC Assessment Pilot</span><h1>Technician Competency Assessment</h1><p>This assessment uses service scenarios to identify what you know. Answer the way you would talk through a job in the shop. You do not need textbook wording.</p><div class="grid"><label>Name<input id="nm"></label><label>Location<input id="loc"></label></div><div class="note">If you are not sure, say so. A single missed question does not automatically fail a competency; the assessment uses evidence across multiple situations.</div><div class="actions"><button class="primary" onclick="startClaims()">Continue</button></div>`)}
function startClaims(){S.name=document.getElementById('nm').value.trim();S.location=document.getElementById('loc').value.trim();claims()}
function claims(){let groups=[...new Set(SCENARIOS.map(s=>s.domain))];app(`<span class="tag">Self report</span><h2>Areas you work in</h2><p>Check the areas where you are comfortable diagnosing or repairing problems. This only helps choose where to start; it does not sign anything off.</p>${groups.map(g=>`<label class="claim"><input type="checkbox" value="${esc(g)}"> <span>${esc(g)}</span></label>`).join('')}<div class="actions"><button class="primary" onclick="begin()">Begin assessment</button></div>`)}
function begin(){document.querySelectorAll('input[type=checkbox]:checked').forEach(x=>S.claims.add(x.value));S.scenarioQueue=[...SCENARIOS].sort((a,b)=>(S.claims.has(b.domain)?1:0)-(S.claims.has(a.domain)?1:0));S.scenarioIndex=0;S.stageIndex=0;renderStage()}
function cur(){let sc=S.scenarioQueue[S.scenarioIndex];return {sc,st:sc?.stages[S.stageIndex]}}
function renderStage(){prog();let {sc,st}=cur();if(!sc||!st)return finish();meta(`${sc.name} • Scenario ${S.scenarioIndex+1} of ${S.scenarioQueue.length}`);let input=st.type==='mc'?st.opts.map((o,i)=>`<div class="opt" onclick="pick(this,${i})" data-i="${i}">${esc(o)}</div>`).join(''):`<textarea id="txt" placeholder="Answer the way you would explain it in the shop..."></textarea><div class="tiny">Copy/paste is disabled. Voice-to-text is fine.</div>`;app(`<span class="tag">${esc(sc.domain)}</span><h2>${esc(sc.name)}</h2><div class="complaint"><b>Customer complaint / job condition</b><br>${esc(sc.complaint)}</div><div class="q">${esc(st.q)}</div>${input}<div class="actions"><button class="secondary" onclick="unsure()">I'm not sure</button><button class="primary" onclick="submitAnswer()">Continue</button></div>`);document.querySelectorAll('textarea,input').forEach(el=>['paste','drop'].forEach(ev=>el.addEventListener(ev,e=>e.preventDefault())))}
let picked=null;function pick(el,i){picked=i;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')}
function unsure(){let {sc,st}=cur();addEvidence(st.targets,'neg',.65,sc.id,'Technician selected not sure');S.answers.push({scenario:sc.id,stage:st.id,response:'I am not sure',result:'uncertain'});next()}
function semantic(st,text){let t=text.toLowerCase();let hits=(st.rubric||[]).filter(k=>t.includes(k.toLowerCase())).length;let ratio=hits/Math.max(1,(st.rubric||[]).length);if(/replace (the )?(board|valve|motor|pump|controller)/i.test(text)&&text.length<70)return {kind:'weak',score:.4};if(text.trim().length<8)return {kind:'ambiguous',score:.25};if(ratio>=.42)return {kind:'strong',score:1.2};if(ratio>=.2||text.length>90)return {kind:'partial',score:.65};return {kind:'ambiguous',score:.3}}
function submitAnswer(){let {sc,st}=cur();if(st.type==='mc'){if(picked===null)return;let ok=picked===st.ans;addEvidence(st.targets,ok?'pos':'neg',ok?1.15:.75,sc.id,ok?'Correct applied choice':'Incorrect applied choice');S.answers.push({scenario:sc.id,stage:st.id,response:st.opts[picked],result:ok?'strong':'miss'});picked=null;return next()}let text=document.getElementById('txt').value.trim();if(!text)return;let r=semantic(st,text);S.answers.push({scenario:sc.id,stage:st.id,response:text,result:r.kind});if(r.kind==='strong'){addEvidence(st.targets,'pos',r.score,sc.id,'Strong short-answer evidence');return next()}if(r.kind==='partial'){addEvidence(st.targets,'pos',r.score,sc.id,'Partial short-answer evidence');return next()}if(r.kind==='ambiguous'&&!S.clarified[st.id]){S.clarified[st.id]=true;return clarify(sc,st,text)}addEvidence(st.targets,'neg',r.score,sc.id,'Weak/unclear after clarification');next()}
function clarify(sc,st,first){app(`<span class="tag">Clarifying question</span><h2>${esc(sc.name)}</h2><div class="note">Your first answer did not give enough information to tell whether this was a wording issue or a knowledge gap. It is not being counted as a wrong answer yet.</div><div class="q">${esc(st.clarify||'Explain what you would physically check next and what the result would tell you.')}</div><textarea id="txt2" placeholder="Explain it another way..."></textarea><div class="actions"><button class="secondary" onclick="clarifyUnsure()">I'm not sure</button><button class="primary" onclick="submitClarify()">Continue</button></div>`)}
function clarifyUnsure(){let {sc,st}=cur();addEvidence(st.targets,'neg',.65,sc.id,'Not sure after clarification');S.answers.push({scenario:sc.id,stage:st.id+'C',response:'I am not sure',result:'uncertain'});next()}
function submitClarify(){let {sc,st}=cur(),text=document.getElementById('txt2').value.trim();if(!text)return;let r=semantic(st,text);S.answers.push({scenario:sc.id,stage:st.id+'C',response:text,result:r.kind});if(r.kind==='strong'||r.kind==='partial')addEvidence(st.targets,'pos',r.kind==='strong'?1.1:.6,sc.id,'Recovered on reworded clarifier');else addEvidence(st.targets,'neg',.65,sc.id,'Still unclear after rewording');next()}
function shouldCloseScenario(sc){let recent=S.answers.filter(a=>a.scenario===sc.id).slice(-2);if(recent.length<2)return false;let misses=recent.filter(a=>['miss','uncertain'].includes(a.result)).length;return misses>=2}
function next(){let sc=S.scenarioQueue[S.scenarioIndex];S.stageIndex++;if(shouldCloseScenario(sc)||S.stageIndex>=sc.stages.length){S.scenarioIndex++;S.stageIndex=0}renderStage()}
function finish(){ALL.forEach(x=>{let s=S.skill[x.id];if(!s.resolved)s.resolved='NO'});let yes=ALL.filter(x=>S.skill[x.id].resolved==='YES'),no=ALL.filter(x=>S.skill[x.id].resolved==='NO');app(`<span class="tag">Complete</span><h1>Assessment complete</h1><p>Thank you, ${esc(S.name||'technician')}. Your responses have been evaluated across the scenarios you completed.</p><div class="metricgrid"><div class="metric"><div class="v">${yes.length}</div><div class="l">Competencies with sufficient evidence in this pilot</div></div><div class="metric"><div class="v">${no.length}</div><div class="l">Remain open / insufficient evidence</div></div><div class="metric"><div class="v">${S.answers.length}</div><div class="l">Responses reviewed</div></div></div><div class="note"><b>Pilot note:</b> This version is for validating scenario flow and adaptive behavior. Final UKG decisions require the complete competency map and production semantic evaluator.</div><div class="actions"><button class="primary" onclick="downloadResults()">Download pilot results</button></div>`);meta('Assessment complete');document.getElementById('fill').style.width='100%'}
function downloadResults(){let rows=['Technician,Location,UKG ID,Competency,Result,Positive Evidence,Negative Evidence,Contexts'];ALL.forEach(x=>{let s=S.skill[x.id];rows.push([S.name,S.location,x.id,x.title,s.resolved,s.pos.toFixed(2),s.neg.toFixed(2),[...s.contexts].join('|')].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))});let blob=new Blob([rows.join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='TEC-pilot-results.csv';a.click();URL.revokeObjectURL(a.href)}
initSkills();profile();
</script></body></html>
